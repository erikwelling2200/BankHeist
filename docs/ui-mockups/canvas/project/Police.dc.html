<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Police: what is announced, what is only visible</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0d17}
.phase{display:flex;align-items:center;gap:2px;padding:0 6px}
.phase span{display:flex;align-items:center;gap:2px;height:24px;padding:0 4px;border-radius:4px;color:var(--dim)}
.phase span.on{background:var(--red);color:#fff}
.phase img{width:18px;height:18px;image-rendering:pixelated}
.edge{position:absolute;display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel);border:1px solid var(--line);border-radius:2px}
</style>
</helmet>
<div class="phone">
  <img class="world" src="img/police.png" alt="Police outside the lobby glass: a breach marker on a window, a landed grenade with its radius, a red sniper laser, an officer's red watch wedge and a faded ghost of an officer seen last turn">
  <div class="notch"></div>

  <div class="top">
    <div class="panel heat"><img class="ic m" src="img/i-heat.png" alt="Heat"><span class="num">3</span><div class="heat-bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <span class="heat-next"><span class="num" style="font-size:18px">&#9654;4</span><img class="ic m" src="img/i-swat.png" alt="SWAT"><img class="ic m" src="img/i-dmr.png" alt="Snipers"><span class="num" style="font-size:18px">1</span></span></div>
    <div class="panel phase">
      <span><img src="img/i-shield.png" alt="Contain"></span>
      <span><img src="img/i-phone.png" alt="Negotiate"></span>
      <span class="on"><img src="img/i-charge.png" alt="Assault"><b class="num" style="font-size:18px">4</b></span>
      <span><img src="img/i-car.png" alt="Regroup"></span>
    </div>
    <div class="panel turn" style="margin-left:auto"><span class="num">31</span></div>
    <button class="panel ledger-btn" aria-label="Threat ledger"><img class="ic" src="img/i-bell.png" alt=""><span class="count">3</span></button>
  </div>

  <div class="rail">
    <div class="crew sel" style="--c: var(--mara)"><img class="face" src="img/p-mara-m.png" alt="Mara, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-smg.png" alt="Machine pistol"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--jun)"><img class="face" src="img/p-jun-m.png" alt="Jun, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-pistol.png" alt="Pistol"><div class="hp hurt"><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
    <div class="crew" style="--c: var(--dex)"><img class="face" src="img/p-dex-m.png" alt="Dex, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-lmg.png" alt="LMG"><img class="carry" src="img/i-drill.png" alt="Drill running"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--sol)"><img class="face" src="img/p-sol-m.png" alt="Sol, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-dmr.png" alt="DMR"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <!-- a gunshot heard out of sight: a ping at the edge, no position -->
  <div class="edge" style="left: 112px; top: 150px; border-color: var(--amber)"><span class="num">&#9664;</span><img class="ic m" src="img/i-ear.png" alt="Gunfire"></div>

  <div class="ltools">
    <button class="btn" aria-label="Tactical map"><img class="ic" src="img/i-map.png" alt=""></button>
    <button class="btn" aria-label="Overlays"><img class="ic" src="img/i-layers.png" alt=""></button>
  </div>
  <button class="endturn" aria-label="End turn, hold"><img class="ic" src="img/i-end.png" alt=""></button>
  <div class="actions">
    <div class="actrow">
      <button class="act" aria-label="Flip table"><img class="ic" src="img/i-flip.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act" aria-label="Throw flashbang"><img class="ic" src="img/i-grenade.png" alt=""><span class="cost"><i></i></span><span class="count" style="background: var(--iv); color: var(--ink)">2</span></button>
    </div>
    <div class="actrow">
      <button class="act" aria-label="Attack"><img class="ic" src="img/i-attack.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act sel" aria-label="Move"><img class="ic" src="img/i-move.png" alt=""><span class="cost"><i></i></span></button>
    </div>
  </div>
  <button class="panel btn undo" aria-label="Undo"><img class="ic" src="img/i-undo.png" alt=""></button>
  <button class="confirm off" aria-label="Confirm"><img class="ic" src="img/i-move.png" alt=""><span class="cname">Move</span></button>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
