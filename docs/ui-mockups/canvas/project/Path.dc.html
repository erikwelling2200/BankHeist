<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stealth: drag a path</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0d17}</style>
</helmet>
<div class="phone">
  <img class="world" src="img/stealth-path.png" alt="Jun's path to the staff door; the last tile is hatched amber with an eye">
  <div class="notch"></div>

  <div class="top">
    <div class="panel state quiet"><img class="ic m" src="img/i-eye.png" alt=""><span class="num" style="font-size:15px">QUIET</span></div>
    <div class="panel timeline">
      <div class="tl-track">
        <div class="tl-done" style="width: 20%"></div>
        <div class="tl-ev" style="left: 17.8%"><img src="img/i-fork.png" alt="Lunch"><b>8</b></div>
        <div class="tl-now" style="left: 20%"></div>
        <div class="tl-ev" style="left: 26.7%"><img src="img/i-cart.png" alt="Cash run"><b>12</b></div>
        <div class="tl-ev" style="left: 44.4%"><img src="img/i-truck.png" alt="Armoured car"><b>20</b></div>
        <div class="tl-ev" style="left: 66.7%"><img src="img/i-police.png" alt="Patrol drive-by"><b>30</b></div>
        <div class="tl-ev" style="left: 100%"><img src="img/i-moon.png" alt="Closing"><b>45</b></div>
      </div>
    </div>
    <div class="panel turn"><span class="num">9</span></div>
    <button class="panel ledger-btn" aria-label="Threat ledger"><img class="ic" src="img/i-bell.png" alt=""></button>
  </div>

  <div class="rail">
    <div class="crew" style="--c: var(--mara)"><img class="face" src="img/p-mara.png" alt="Mara"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-clean.png" alt="Clean"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew sel" style="--c: var(--jun)"><img class="face" src="img/p-jun.png" alt="Jun"><div class="ap"><i></i><i class="off" style="box-shadow:0 0 0 1px var(--jun)"></i></div><img class="prof" src="img/i-concealed.png" alt="Concealed"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew dim" style="--c: var(--dex)"><img class="face" src="img/p-dex.png" alt="Dex"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-heavy.png" alt="Heavy"><img class="carry" src="img/i-car.png" alt="In the van"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew dim" style="--c: var(--sol)"><img class="face" src="img/p-sol.png" alt="Sol"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-armed.png" alt="Armed"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <div class="ltools">
    <button class="btn" aria-label="Tactical map"><img class="ic" src="img/i-map.png" alt=""></button>
    <button class="btn" aria-label="Overlays"><img class="ic" src="img/i-layers.png" alt=""></button>
  </div>
  <button class="endturn" aria-label="End turn, hold"><img class="ic" src="img/i-end.png" alt=""></button>

  <!-- preview chip: who notices, and when (hatched = next world phase). Drawn up and left of the finger, never under it. -->
  <div class="chip amber" style="left: 470px; top: 92px">
    <img class="p" src="img/p-cleaner.png" alt="Cleaner">
    <img class="ic m" src="img/i-hold.png" alt="Challenge">
    <span style="width: 18px; height: 18px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--amber) 0 3px, rgba(240,168,40,.25) 3px 6px); border: 1px solid #000"></span>
  </div>

  <div class="actions">
    <div class="actrow">
      <button class="act" aria-label="Interact"><img class="ic" src="img/i-interact.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act" aria-label="Knockout"><img class="ic" src="img/i-knockout.png" alt=""><span class="cost"><i></i></span></button>
    </div>
    <div class="actrow">
      <button class="act" aria-label="Wait for"><img class="ic" src="img/i-wait.png" alt=""></button>
      <button class="act sel" aria-label="Move"><img class="ic" src="img/i-move.png" alt=""><span class="cost"><i></i></span></button>
    </div>
  </div>
  <button class="panel btn undo" aria-label="Undo"><img class="ic" src="img/i-undo.png" alt=""></button>
  <button class="confirm warn" aria-label="Confirm move"><img class="ic" src="img/i-move.png" alt=""><span class="cname">Move</span><span class="cost"><i></i></span></button>

  <div class="finger ghost" style="left: 496px; top: 336px"></div>
  <div class="finger" style="left: 656px; top: 186px"></div>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
