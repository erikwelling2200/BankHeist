<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Takeover: the lobby held</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0d17}
.edge{position:absolute;display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel);border:1px solid var(--red);border-radius:2px}
</style>
</helmet>
<div class="phone">
  <img class="world" src="img/go-after.png" alt="Everyone in the lobby is face down with two blue command pips; the guard is tied; Dex's hold ring outlines the room he keeps down">
  <div class="notch"></div>

  <div class="top">
    <div class="panel state" style="border-color: var(--red)"><img class="ic m" src="img/i-ear.png" alt=""><span class="num" style="color: var(--red)">LOUD</span></div>
    <div class="panel timeline">
      <div class="tl-track">
        <div class="tl-done" style="width: 33.3%"></div>
        <div class="tl-ev" style="left: 17.8%"><img src="img/i-fork.png" alt="Lunch"><b>8</b></div>
        <div class="tl-ev" style="left: 26.7%"><img src="img/i-cart.png" alt="Cash run"><b>12</b></div>
        <div class="tl-now" style="left: 33.3%"></div>
        <div class="tl-ev" style="left: 44.4%"><img src="img/i-truck.png" alt="Armoured car"><b>20</b></div>
        <div class="tl-ev" style="left: 66.7%"><img src="img/i-police.png" alt="Patrol drive-by"><b>30</b></div>
        <div class="tl-ev" style="left: 100%"><img src="img/i-moon.png" alt="Closing"><b>45</b></div>
      </div>
    </div>
    <div class="panel turn"><span class="num">15</span></div>
    <button class="panel ledger-btn" aria-label="Threat ledger"><img class="ic" src="img/i-bell.png" alt=""><span class="count">1</span></button>
  </div>

  <div class="rail">
    <div class="crew sel" style="--c: var(--mara)"><img class="face" src="img/p-mara-m.png" alt="Mara, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-heavy.png" alt="Heavy"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--jun)"><img class="face" src="img/p-jun-m.png" alt="Jun, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-heavy.png" alt="Heavy"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--dex)"><img class="face" src="img/p-dex-m.png" alt="Dex, masked, holding"><div class="ap"><i class="off"></i><i class="off"></i></div><img class="prof" src="img/i-heavy.png" alt="Heavy">
      <img class="carry" src="img/i-hold.png" alt="Holding" style="background: var(--cmd); border-radius: 4px; border: 1px solid var(--ink)">
      <div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="done"></div></div>
    <div class="crew" style="--c: var(--sol)"><img class="face" src="img/p-sol-m.png" alt="Sol, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-heavy.png" alt="Heavy"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <!-- someone hid in the restroom with a phone: off screen, so it waits at the edge pointing the way -->
  <div class="edge" style="right: 44px; top: 112px"><span class="num" style="color: var(--red)">2</span><img class="ic m" src="img/i-phone.png" alt="Phone call"><span class="num">&#9654;</span></div>

  <div class="ltools">
    <button class="btn" aria-label="Tactical map"><img class="ic" src="img/i-map.png" alt=""></button>
    <button class="btn" aria-label="Overlays"><img class="ic" src="img/i-layers.png" alt=""></button>
  </div>
  <button class="endturn" aria-label="End turn, hold"><img class="ic" src="img/i-end.png" alt=""></button>
  <div class="actions">
    <div class="actrow">
      <button class="act" aria-label="Coerce"><img class="ic" src="img/i-interact.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act" aria-label="Zip-tie"><img class="ic" src="img/i-ziptie.png" alt=""><span class="cost"><i></i></span><span class="count" style="background: var(--iv); color: var(--ink)">4</span></button>
    </div>
    <div class="actrow">
      <button class="act" aria-label="Command"><img class="ic" src="img/i-command.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act sel" aria-label="Move"><img class="ic" src="img/i-move.png" alt=""><span class="cost"><i></i></span></button>
    </div>
  </div>
  <button class="panel btn undo" aria-label="Undo"><img class="ic" src="img/i-undo.png" alt=""></button>
  <button class="confirm off" aria-label="Confirm"><img class="ic" src="img/i-move.png" alt=""><span class="cname">Move</span></button>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
