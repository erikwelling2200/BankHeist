<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combat: dragging a Watch wedge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#0b0d17}
.phase{display:flex;align-items:center;gap:2px;padding:0 6px}
.phase span{display:flex;align-items:center;gap:2px;height:24px;padding:0 4px;border-radius:4px;color:var(--dim)}
.phase span.on{background:var(--iv);color:var(--ink)}
.phase img{width:18px;height:18px;image-rendering:pixelated}
</style>
</helmet>
<div class="phone">
  <img class="world" src="img/watch.png" alt="Dex's blue watch wedge being dragged across the lobby; an officer at the door holds a red wedge of his own">
  <div class="notch"></div>

  <div class="top">
    <div class="panel heat"><img class="ic m" src="img/i-heat.png" alt="Heat"><span class="num">2</span><div class="heat-bar"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
      <span class="heat-next"><span class="num" style="font-size:18px">&#9654;3</span><img class="ic m" src="img/i-swat.png" alt="SWAT"><span class="num" style="font-size:18px">3</span></span></div>
    <div class="panel phase">
      <span class="on"><img src="img/i-shield.png" alt="Contain"><b class="num" style="font-size:18px">1</b></span>
      <span><img src="img/i-phone.png" alt="Negotiate"></span>
      <span><img src="img/i-charge.png" alt="Assault"></span>
      <span><img src="img/i-car.png" alt="Regroup"></span>
    </div>
    <div class="panel turn" style="margin-left:auto"><span class="num">22</span></div>
    <button class="panel ledger-btn" aria-label="Threat ledger"><img class="ic" src="img/i-bell.png" alt=""></button>
  </div>

  <div class="rail">
    <div class="crew" style="--c: var(--mara)"><img class="face" src="img/p-mara-m.png" alt="Mara, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-smg.png" alt="Machine pistol"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--jun)"><img class="face" src="img/p-jun-m.png" alt="Jun, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-pistol.png" alt="Pistol"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew sel" style="--c: var(--dex)"><img class="face" src="img/p-dex-m.png" alt="Dex, masked"><div class="ap"><i style="box-shadow:0 0 0 1px #fff"></i><i style="box-shadow:0 0 0 1px #fff"></i></div><img class="prof" src="img/i-lmg.png" alt="LMG"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="crew" style="--c: var(--sol)"><img class="face" src="img/p-sol-m.png" alt="Sol, masked"><div class="ap"><i></i><i></i></div><img class="prof" src="img/i-dmr.png" alt="DMR"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <!-- the widest wedge this weapon allows, as a faint guide the drag can't pass -->
  <svg style="position:absolute;left:0;top:0;width:844px;height:390px;pointer-events:none" viewBox="0 0 844 390" aria-hidden="true">
    <path d="M560 176 L 300 176" stroke="#8cd2ff" stroke-width="2" stroke-dasharray="6 6" fill="none"></path>
    <path d="M560 176 L 335 306" stroke="#e2dac6" stroke-width="2" stroke-dasharray="2 6" fill="none" opacity=".7"></path>
  </svg>

  <div class="ltools">
    <button class="btn" aria-label="Tactical map"><img class="ic" src="img/i-map.png" alt=""></button>
    <button class="btn" aria-label="Overlays"><img class="ic" src="img/i-layers.png" alt=""></button>
  </div>
  <button class="endturn" aria-label="End turn, hold"><img class="ic" src="img/i-end.png" alt=""></button>
  <div class="actions">
    <div class="actrow">
      <button class="act" aria-label="Suppress"><img class="ic" src="img/i-suppress.png" alt=""><span class="cost"><i></i><i></i></span></button>
      <button class="act" aria-label="Brace"><img class="ic" src="img/i-lmg.png" alt=""><span class="cost"><i></i></span></button>
    </div>
    <div class="actrow">
      <button class="act" aria-label="Attack"><img class="ic" src="img/i-attack.png" alt=""><span class="cost"><i></i></span></button>
      <button class="act sel" aria-label="Watch"><img class="ic" src="img/i-watch.png" alt=""><span class="cost"><i></i><i></i></span></button>
    </div>
  </div>
  <button class="panel btn undo" aria-label="Undo"><img class="ic" src="img/i-undo.png" alt=""></button>
  <button class="confirm" aria-label="Set watch" style="background: var(--cmd)"><img class="ic" src="img/i-watch.png" alt=""><span class="cname">Watch</span><span class="cost"><i></i><i></i></span></button>
  <div class="finger" style="left: 300px; top: 176px"></div>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
