<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resume: the recap card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0d17}
.ev{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px;border-radius:2px;background:rgba(255,255,255,.04)}
.ev img.p{width:30px;height:30px;image-rendering:pixelated;border-radius:1px}
.mini{position:relative;width:52px;height:60px;border-radius:2px;background:rgba(226,218,198,.05);border:1px solid var(--c)}
.mini img{position:absolute;left:4px;top:4px;width:40px;height:40px;image-rendering:pixelated;border-radius:1px}
.mini .hp{position:absolute;left:4px;right:4px;bottom:4px;height:5px;display:flex;gap:1px}
.mini .hp i{flex:1;background:#57d07c}.mini .hp i.off{background:#3a2a30}.mini .hp.hurt i{background:var(--amber)}
</style>
</helmet>
<div class="phone">
  <img class="world dimmed" src="img/police.png" alt="">
  <div class="notch"></div>

  <!-- reopening the app: where am I, what just happened, what's coming -->
  <div class="sheet" style="left: 120px; right: 120px; top: 24px; bottom: 30px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px">
    <div class="col" style="gap: 6px">
      <div class="row"><span class="big">31</span><span style="flex:1"></span><img class="ic" src="img/i-heat.png" alt="Heat"><span class="big">3</span>
        <div class="heat-bar"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
      <div class="row" style="gap: 4px"><span class="panel row" style="padding:2px 6px;border-color:var(--red);background:rgba(80,14,14,.9)"><img class="ic m" src="img/i-charge.png" alt="Assault"><span class="num">4</span></span><span class="num" style="color:var(--dim)">&#9654;</span><img class="ic m" src="img/i-car.png" alt="Regroup next"></div>
      <div class="ev"><img class="p" src="img/p-swat.png" alt="SWAT"><img class="ic m" src="img/i-charge.png" alt="breached"><span style="flex:1"></span><span class="tiny">30</span></div>
      <div class="ev"><img class="p" src="img/p-jun-m.png" alt="Jun"><img class="ic m" src="img/i-attack.png" alt="was hit"><span class="num" style="color:var(--red)">-4</span><span style="flex:1"></span><span class="tiny">30</span></div>
      <div class="ev"><img class="p" src="img/p-dex-m.png" alt="Dex"><img class="ic m" src="img/i-drill.png" alt="drill"><span class="num" style="color:var(--amber)">3</span><span style="flex:1"></span><span class="tiny">31</span></div>
    </div>
    <div class="col" style="gap: 8px; align-items: center; justify-content: space-between">
      <div class="row" style="gap: 6px">
        <div class="mini" style="--c: var(--mara)"><img src="img/p-mara-m.png" alt="Mara"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="mini" style="--c: var(--jun)"><img src="img/p-jun-m.png" alt="Jun, hurt"><div class="hp hurt"><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i><i class="off"></i><i class="off"></i></div></div>
        <div class="mini" style="--c: var(--dex)"><img src="img/p-dex-m.png" alt="Dex"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="mini" style="--c: var(--sol)"><img src="img/p-sol-m.png" alt="Sol"><div class="hp"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <div class="row" style="gap: 6px"><img class="ic" src="img/i-bell.png" alt="Live threats"><span class="ledger-row" style="height:36px"><span class="n" style="width:26px;height:26px;font-size:22px">1</span><img class="ic" src="img/i-charge.png" alt="Breach"></span><span class="ledger-row" style="height:36px"><span class="n a" style="width:26px;height:26px;font-size:22px">1</span><img class="ic" src="img/i-grenade.png" alt="Grenade"></span></div>
      <button class="confirm" aria-label="Resume" style="position: static; width: 100%"><img class="ic" src="img/i-play.png" alt=""><span class="cname">Resume</span></button>
    </div>
  </div>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
